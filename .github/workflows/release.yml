name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: soqq-search-api-linux-x64
          - os: windows-latest
            asset: soqq-search-api-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --name soqq-search-api soqq_search_api.py
      - name: Rename Linux binary
        if: runner.os == 'Linux'
        run: mv dist/soqq-search-api dist/${{ matrix.asset }}
      - name: Rename Windows binary
        if: runner.os == 'Windows'
        run: Move-Item dist/soqq-search-api.exe dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$TAG" artifacts/* --target "$TARGET" --title "$TAG" --generate-notes
